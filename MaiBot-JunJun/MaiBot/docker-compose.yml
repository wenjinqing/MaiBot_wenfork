# MaiBot 多实例部署 compose
# 启动: docker compose -f MaiBot-JunJun/MaiBot/docker-compose.yml up -d
# 说明: 本地 build,端口与 .env.junjun 对齐;Langfuse 服务在仓库根目录 langfuse/ 下独立起
services:
  maibot-junjun:
    container_name: maibot-junjun
    build:
      context: .
      dockerfile: Dockerfile
    image: maibot-junjun:local
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - BOT_ID=junjun_main
      - BOT_CONFIG=config/bot_config.toml
      # Langfuse (从 .env 注入,或在此显式覆盖)
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse-web:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    ports:
      - "8001:8001"   # WebUI
      - "8091:8091"   # maim_message 消息服务 (/ws)
    volumes:
      - ./.env.junjun:/MaiMBot/.env.junjun:ro
      - ./config:/MaiMBot/config
      - ./data:/MaiMBot/data
      - ./logs:/MaiMBot/logs
      - ./template:/MaiMBot/template:ro
    networks:
      - maim_net
      - langfuse_langfuse-net  # 连接根目录 langfuse 网络,容器内可访问 langfuse-web:3000

  napcat:
    # NapCat 运行时 (QQ 协议);也可用本仓库 NapCat.Shell/ 本地跑,二选一
    image: mlikiowa/napcat-docker:latest
    container_name: maibot-napcat
    restart: always
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - TZ=Asia/Shanghai
    ports:
      - "6099:6099"   # NapCat WebUI
    volumes:
      - ./docker-config/napcat:/app/napcat/config
      - ./data/qq:/app/.config/QQ
    networks:
      - maim_net

networks:
  maim_net:
    driver: bridge
  langfuse_langfuse-net:
    external: true   # 由仓库根目录 langfuse/docker-compose.yml 创建